name: CI — Test on Push

on:
  push:
    branches: ['*']
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Upgrade pip, setuptools, wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Clear pip cache
        run: pip cache purge

      - name: Install Python dependencies
        run: pip install -r requirements/development.txt --index-url https://pypi.org/simple

      - name: Create .env for testing
        run: |
          echo 'SECRET_KEY=test-secret-key-for-ci-only' >> .env
          echo 'DEBUG=True' >> .env
          echo 'DJANGO_SETTINGS_MODULE=config.settings.development' >> .env

      - name: Run migrations (SQLite in CI)
        run: python manage.py migrate --settings=config.settings.development

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.development

      - name: Run Django system checks
        run: python manage.py check --settings=config.settings.development

      - name: Run tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            python manage.py test tests --settings=config.settings.development -v 2
          else
            echo "No tests found, skipping..."
          fi