name: CI — Test on Push

on:
  push:
    branches: ['*']
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for Pillow
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev

      - name: Upgrade pip, setuptools, wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # Optional: temporarily disable caching to avoid old index issues
      # - name: Cache pip packages
      #   uses: actions/cache@v3
      #   with:
      #     path: ~/.cache/pip
      #     key: ${{ runner.os }}-pip-${{ hashFiles('requirements/development.txt') }}

      - name: Install Python dependencies
        run: pip install -r requirements/development.txt --index-url https://pypi.org/simple

      - name: Create .env for testing
        run: |
          echo 'SECRET_KEY=test-secret-key-for-ci-only' >> .env
          echo 'DEBUG=True' >> .env
          echo 'DJANGO_SETTINGS_MODULE=config.settings.development' >> .env

      - name: Run migrations (SQLite in CI)
        run: python manage.py migrate --settings=config.settings.development

      - name: Run tests
        run: python manage.py test tests/ --settings=config.settings.development -v 2

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.development

      - name: Run Django system checks
        run: python manage.py check --settings=config.settings.development