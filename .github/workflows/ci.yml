name: CI — Test on Push

on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: test-secret-key-for-ci-only-not-real
      DEBUG: 'True'
      DATABASE_URL: sqlite:///db.sqlite3
      GOOGLE_CLIENT_ID: fake-google-client-id
      GOOGLE_SECRET: fake-google-secret
      EMAIL_HOST_USER: test@example.com
      EMAIL_HOST_PASSWORD: testpassword
      TWILIO_ACCOUNT_SID: ACfaketwiliosid
      TWILIO_AUTH_TOKEN: faketwiliotoken
      TWILIO_PHONE_NUMBER: '+10000000000'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/development.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements/development.txt

      - name: Create .env
        run: |
          cat > .env << 'EOF'
          SECRET_KEY=test-secret-key-for-ci-only-not-real
          DEBUG=True
          DJANGO_SETTINGS_MODULE=config.settings.development
          GOOGLE_CLIENT_ID=fake-google-client-id
          GOOGLE_SECRET=fake-google-secret
          EMAIL_HOST_USER=test@example.com
          EMAIL_HOST_PASSWORD=testpassword
          TWILIO_ACCOUNT_SID=ACfaketwiliosid
          TWILIO_AUTH_TOKEN=faketwiliotoken
          TWILIO_PHONE_NUMBER=+10000000000
          EOF

      - name: Run migrations
        run: python manage.py migrate

      - name: Check missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests)" ]; then
            python manage.py test tests -v 2
          else
            echo "No tests directory found — skipping tests"
          fi