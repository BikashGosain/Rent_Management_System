name: Deploy to Render

on:
  push:
    branches: [main]   # only deploy when main branch is pushed

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []   # optionally add: needs: [test] to block deploy if CI fails

    steps:
      - name: Trigger Render Deploy
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys"

      - name: Notify deploy triggered
        run: echo "Deploy triggered on Render for service ${{ secrets.RENDER_SERVICE_ID }}"
