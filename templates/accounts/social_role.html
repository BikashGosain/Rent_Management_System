{% extends 'base.html' %}
{% block title %}Choose Role — RentMS{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">👋</div>
        <h1 class="auth-title">One Last Step</h1>
        <p class="auth-subtitle">Welcome {{ user.first_name }}! Are you looking to rent or list a property?</p>

        <form method="post">
            {% csrf_token %}
            <div class="role-picker">
                <label class="role-option">
                    <input type="radio" name="role" value="tenant" required>
                    <div class="role-card">
                        <span class="role-icon">🔑</span>
                        <strong>I'm a Tenant</strong>
                        <p>I want to find and rent a property</p>
                    </div>
                </label>
                <label class="role-option">
                    <input type="radio" name="role" value="owner" required>
                    <div class="role-card">
                        <span class="role-icon">🏠</span>
                        <strong>I'm an Owner</strong>
                        <p>I want to list my property for rent</p>
                    </div>
                </label>
            </div>
            <button type="submit" class="auth-btn">Continue →</button>
        </form>
    </div>
</div>
{% endblock %}
